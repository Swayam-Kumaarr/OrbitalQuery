# OrbitalQuery — Render deployment configuration
# Defines both services with correct root directories

services:
  # ── Python Analysis Service ──────────────────────────────────
  - type: web
    name: orbitalquery
    runtime: docker
    dockerfilePath: ./analysis-service/Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"

  # ── Node.js API Gateway ──────────────────────────────────────
  - type: web
    name: orbitalquery-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: PYTHON_SERVICE_URL
        fromService:
          name: orbitalquery
          type: web
          property: host
      - key: PYTHON_SERVICE_TIMEOUT_MS
        value: "30000"
